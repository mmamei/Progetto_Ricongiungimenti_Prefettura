{% extends "baseboot.html" %}

{% block title %}
Migranti
{% endblock %}

{% block app_content %}
<div class="container-fluid">
	<div class="row">
		<h2>Riepilogo Presenze</h2>
		<table id="datatable" class="table table-bordered table-hover">
			<thead>
			<tr>
				<th>Nome</th>
				<th>Cognome</th>
				<th>Stato</th>
				<th>Files</th>
			</tr>
			</thead>
			</tbody>
			{% for mig in migranti %}
				<tr>
					<td>{{ mig[0] }}</td>
					<td>{{ mig[1] }}</td>
                    <td>{{ mig[2] }}</td>
					<td style="text-align: center">
					<form method="post" action="getfiles">
						<input style="display:none" name="nome" value="{{ mig[0] }}"/>
						<input style="display:none" name="cognome" value="{{ mig[1] }}"/>
						<button type="submit" class="btn btn-default btn-sm">
							<i class="bi-plus-circle" style="font-size: 2rem;"></i>
						</button>
					</form>
					</td>
				</tr>
			{% endfor %}
			</tbody>
		</table>
	</div>
</div>
<script>$(document).ready(function () {$('#datatable').DataTable();});</script>
{% endblock %}
