{% if security.registerable or security.recoverable or security.confirmable %}
{% if security.registerable %}
<div class="btn btn-default"><a href="{{ url_for_security('register') }}{% if 'next' in request.args %}?next={{ request.args.next|urlencode }}{% endif %}">{{ _('Register') }}</a></div>
{% endif %}
{% if security.recoverable %}
<div class="btn btn-default"><a href="{{ url_for_security('forgot_password') }}">{{ _('Forgot password') }}</a></div>
{% endif %}
{% if security.confirmable %}
<div class="btn btn-default"><a href="{{ url_for_security('send_confirmation') }}">{{ _('Confirm account') }}</a></div>
{% endif %}
{% endif %}
