{% extends "baseboot.html" %}

{% block title %}
Aggiungi un file
{% endblock %}

{% block app_content %}
<h2>Inserire i dati relativi al nuovo utente:</h2>
<form method="post" enctype="multipart/form-data">


	<div class="form-group row">
    <label for="nome" class="col-sm-2 col-form-label">Nome</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="nome" name="nome" placeholder="nome" required>
    </div>
  	</div>

	<div class="form-group row">
    <label for="cognome" class="col-sm-2 col-form-label">Cognome</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="cognome" name="cognome" placeholder="cognome" required>
    </div>
  	</div>

    <div class="form-group row">
    <label for="file" class="col-sm-4 col-form-label">File</label>
    <div class="col-sm-8">
      <input type="file" id='file' name="file"/>
    </div>
  	</div>


	<button type="submit" class="btn btn-primary">Carica</button>

{% endblock %}
